<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Pendaftaran Lomba</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <h2>Data Tim</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width:100%;">
            <tr>
                <td>
                    <label for="nama_tim"><strong>Informasi Tim Peserta</strong></label>
                </td>
                <td>
                    <input type="text" id="nama_tim" name="nama_tim" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nama_ketua"><strong>Nama Ketua Tim</strong></label>
                </td>
                <td>
                    <input type="text" id="nama_ketua" name="nama_ketua" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="jumlah_anggota"><strong>Jumlah Anggota Tim</strong></label>
                </td>
                <td>
                    <input type="text" id="jumlah_anggota" name="jumlah_anggota" size="10" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            </table>
        <h2>Kategori Kompetisi</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width:100%;">
            <tr>
                <td>
                    <strong>Kategori Lomba</strong>
                </td>
                <td>
                    <input type="radio" id="Individu" name="tipe_lomba" value="Individu" />
                    <label for="Individu">Individu</label>

                    <input type="radio" id="Kelompok" name="tipe_lomba" value="Kelompok" />
                    <label for="Kelompok">Kelompok</label>
                </td>
            </tr>
            <tr>
                <td style="vertical-align:top;">
                    <strong>Bidang Lomba</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="Prog" name="bidang"
                               value="Programming" />
                        <label for="Prog">Programming</label>
                    </p>
                    <p>
                        <input type="checkbox" id="UI" name="bidang"
                               value="User Interface" />
                        <label for="UI">UI/UX Design</label>
                    </p>
                    <p>
                        <input type="checkbox" id="tulis" name="bidang"
                               value="Karya Tulis" />
                        <label for="tulis">Karya Tulis</label>
                    </p>
                </td>
            </tr>
        </table>
        <h2>Informasi Karya</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width:100%;">
            <tr>
                <td style="vertical-align:top;">
                    <label for="deskripsi">
                        <strong>Deskripsi Karya</strong>
                    </label>
                </td>
                <td>
                    <textarea id="deskripsi" name="deskripsi" 
                        rows="8" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Karya">
                        <strong>File Karya</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="Karya" name="karya"
                           accept="image/gif, image/jpeg, image/png" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="Daftar" value="Daftar" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
